# ==========================================================================
# nginx - site da API fiscal (NF-e + NFS-e + Monitor)
#
# Onde colocar:  /etc/nginx/sites-available/nfe-integracao
# Ativar:        ln -s /etc/nginx/sites-available/nfe-integracao /etc/nginx/sites-enabled/
# Testar:        nginx -t
#
# TROQUE: server_name (seu dominio) e, se mudou, o caminho em "root".
# O HTTPS (cadeado) e adicionado depois pelo certbot, automaticamente.
# Manual completo: docs/manual-implantacao.md
# ==========================================================================

server {
    listen 80;
    # IPv6: descomente a linha abaixo se o servidor tiver IPv6 ativo.
    # (Se o servidor nao tiver IPv6, esta linha impede o nginx de iniciar.)
    # listen [::]:80;

    # TROQUE pelo endereco do servidor (ex.: fiscal.suaempresa.com.br)
    server_name SEU_DOMINIO_AQUI;

    # Somente a pasta "public" fica visivel na internet.
    # config/, storage/ (certificados!) e src/ ficam fora dela, protegidos.
    root /var/www/nfe-integracao/public;
    index index.php index.html;

    # Lotes grandes de notas em JSON.
    client_max_body_size 10m;

    access_log /var/log/nginx/nfe-integracao.access.log;
    error_log  /var/log/nginx/nfe-integracao.error.log;

    # Nunca servir arquivos ocultos (.git, .env...).
    location ~ /\. {
        deny all;
    }

    # Monitor em tempo real (SSE): conexao longa e SEM buffer, senao o
    # painel so recebe os eventos em blocos. Usa um pool PHP separado para
    # nao ocupar os processos da API (ver deploy/php-fpm/nfse-monitor.conf).
    location = /v1/nfse/monitor.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-nfse-monitor.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 360s;
        gzip off;
    }

    # Demais rotas PHP da API.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # A emissao aceita ?aguardar=ate 60s; damos folga.
        fastcgi_read_timeout 120s;
    }

    # Arquivos estaticos (pagina do monitor: /monitor/).
    location / {
        try_files $uri $uri/ =404;
    }
}
