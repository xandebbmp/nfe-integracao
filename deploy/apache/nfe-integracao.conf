# ==========================================================================
# Apache 2.4 + PHP-FPM 8.3 - API fiscal (alternativa ao nginx)
#
# Instalar (Ubuntu):
#   sudo apt install apache2
#   sudo a2enmod proxy proxy_fcgi setenvif rewrite headers
#   sudo cp deploy/apache/nfe-integracao.conf /etc/apache2/sites-available/
#   (troque SEU_DOMINIO_AQUI)
#   sudo a2ensite nfe-integracao && sudo a2dissite 000-default
#   sudo apachectl configtest && sudo systemctl reload apache2
#   HTTPS: sudo apt install certbot python3-certbot-apache && sudo certbot --apache
#
# Use o pool extra do monitor (deploy/php-fpm/nfse-monitor.conf), igual ao nginx.
# Explicacao de cada bloco: docs/manual-operacao.md, secao "Servidor web".
# ==========================================================================

<VirtualHost *:80>
    ServerName SEU_DOMINIO_AQUI
    DocumentRoot /var/www/nfe-integracao/public

    ErrorLog ${APACHE_LOG_DIR}/nfe-integracao.error.log
    CustomLog ${APACHE_LOG_DIR}/nfe-integracao.access.log combined

    <Directory /var/www/nfe-integracao/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Nunca servir arquivos ocultos (.env, .git...).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Repassa o cabecalho Authorization: Bearer para o PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Tamanho maximo do corpo (lote JSON, upload de certificado): 10 MB.
    LimitRequestBody 10485760

    # ---- Monitor em tempo real (SSE) -------------------------------------
    # Pool PHP separado, sem buffer e sem compressao: cada evento precisa
    # chegar na hora ao navegador. A conexao dura ate ~5 min (o navegador
    # reconecta sozinho), por isso o timeout maior.
    SetEnvIf Request_URI "^/v1/nfse/monitor\.php" no-gzip=1
    ProxyPassMatch "^/v1/nfse/monitor\.php$" "unix:/run/php/php8.3-fpm-nfse-monitor.sock|fcgi://localhost/var/www/nfe-integracao/public/v1/nfse/monitor.php" flushpackets=on timeout=400

    # ---- Demais rotas PHP (API, painel admin) ----------------------------
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ProxyTimeout 120
</VirtualHost>
