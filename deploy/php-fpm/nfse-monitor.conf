; ==========================================================================
; PHP-FPM - pool separado so para o stream do Monitor (SSE)
;
; Onde colocar:  /etc/php/8.3/fpm/pool.d/nfse-monitor.conf
; Aplicar:       systemctl restart php8.3-fpm
;
; Por que separado? Cada painel aberto no navegador segura um processo PHP
; por varios minutos. Com pool proprio, muitos paineis abertos nunca deixam
; a API (emissao/consulta) sem processos livres.
; ==========================================================================

[nfse-monitor]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-nfse-monitor.sock
listen.owner = www-data
listen.group = www-data

; Cria processos so quando alguem abre o painel.
pm = ondemand
; Maximo de paineis abertos ao mesmo tempo. Aumente se precisar.
pm.max_children = 10
pm.process_idle_timeout = 30s

; O stream encerra sozinho a cada ~5 min (o navegador reconecta).
request_terminate_timeout = 400s
